name: JivaCare Auto Validator

on:
  schedule:
    - cron: '0 * * * *' # Berjalan otomatis setiap jam
  workflow_dispatch: # Tombol manual "Run workflow"

jobs:
  run-validator:
    runs-on: ubuntu-latest

    steps:
    - name: Ambil Kode dari GitHub
      uses: actions/checkout@v4

    - name: Setup Python di Server
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' 
    - name: Instal Semua Library (Requirements)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Jalankan Skrip Validator AI
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: python train_transformer_validator.py